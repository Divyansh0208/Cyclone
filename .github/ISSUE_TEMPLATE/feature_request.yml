name: Feature or data request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and why (responders, researchers, developers).
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed approach
  - type: textarea
    id: data
    attributes:
      label: Data source and licence (if new data)
      description: Real, openly accessible data only. No synthetic data.
