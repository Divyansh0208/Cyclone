<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Cyclone Impact Forecaster: intensity MAE 3.04 kt vs 3.49 kt baseline, impact log-MAE 2.50 vs 2.69 baseline, 61 real EM-DAT events" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="420" fill="#0b2f3a"/>
  <g fill="none" stroke="#e8593c" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <path d="M1080 90a48 48 0 1 1-48 48"/>
    <path d="M1080 62a76 76 0 1 0 76 76" opacity="0.55"/>
  </g>
  <circle cx="1080" cy="138" r="9" fill="#faf6ef"/>
  <text x="60" y="95" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#faf6ef">Cyclone Impact Forecaster</text>
  <text x="60" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#9fc4cc">Who gets hit, before landfall. North Indian Ocean, district level.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="60" y="190" width="340" height="150" rx="14" fill="#123f4c"/>
    <text x="85" y="250" font-size="54" fill="#faf6ef" font-family="Georgia, serif">3.04 kt</text>
    <text x="85" y="282" font-size="18" fill="#faf6ef">6-hour intensity error (MAE)</text>
    <text x="85" y="312" font-size="16" fill="#9fc4cc">vs 3.49 kt last-value baseline</text>

    <rect x="430" y="190" width="340" height="150" rx="14" fill="#123f4c"/>
    <text x="455" y="250" font-size="54" fill="#faf6ef" font-family="Georgia, serif">2.50</text>
    <text x="455" y="282" font-size="18" fill="#faf6ef">Impact error (log-MAE)</text>
    <text x="455" y="312" font-size="16" fill="#9fc4cc">vs 2.69 mean baseline</text>

    <rect x="800" y="190" width="340" height="150" rx="14" fill="#123f4c"/>
    <text x="825" y="250" font-size="54" fill="#faf6ef" font-family="Georgia, serif">61</text>
    <text x="825" y="282" font-size="18" fill="#faf6ef">real EM-DAT impact events</text>
    <text x="825" y="312" font-size="16" fill="#9fc4cc">so the UI shows the 10-90% range</text>

    <text x="60" y="382" font-size="16" fill="#9fc4cc">Real data only: IBTrACS (NOAA) · EM-DAT (CRED) · Census of India 2011. Cross-validated. Decision support, not a warning system.</text>
  </g>
</svg>
